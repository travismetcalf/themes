name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# This public repository cannot call the private shared fleet workflow.
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/install-hermes.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --no-banner --redact

  codex-themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate Codex themes
        run: ./scripts/build-codex-themes.rb
      - name: Verify generated files
        run: git diff --exit-code -- apps/codex
